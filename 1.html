<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remorse - Discord Profiles</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX compilation in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Configuration & Styles -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a; /* bg-blue-950 equivalent */
            color: #e2e8f0;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e3a8a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }
        /* Noise and gradient overlay */
        .bg-noise {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIi8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiMwMDAiLz4KPC9zdmc+');
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Mock Data (Replace with actual Discord API / Lanyard data later) ---
        const brothersData = [
            {
                id: 1,
                name: "Ron",
                handle: "gid2rare",
                avatar: "https://i.pravatar.cc/150?u=ron",
                banner: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=400&q=80",
                status: "online",
                details: "Family Leader & Founder"
            }
        ];

        const secondGenData = [
            { id: 1, name: "Kousei", handle: "seojeoheon", avatar: "https://i.pravatar.cc/150?u=kousei", banner: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=400&q=80", status: "idle", details: "2nd Gen Member" },
            { id: 2, name: "Albertooo", handle: "papamolicious", avatar: "https://i.pravatar.cc/150?u=alberto", banner: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80", status: "online", details: "2nd Gen Member" },
            { id: 3, name: "sadist", handle: "dttm", avatar: "https://i.pravatar.cc/150?u=sadist", banner: "https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=400&q=80", status: "dnd", details: "2nd Gen Member" },
            { id: 4, name: "zzzdiz ♡", handle: "elaisz4", avatar: "https://i.pravatar.cc/150?u=zzz", banner: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=400&q=80", status: "offline", details: "2nd Gen Member" },
            { id: 5, name: "Ysabel ♡", handle: "sirrl_0421", avatar: "https://i.pravatar.cc/150?u=ysabel", banner: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=400&q=80", status: "online", details: "2nd Gen Member" },
            { id: 6, name: "Genji", handle: "3rdst.saint", avatar: "https://i.pravatar.cc/150?u=genji", banner: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80", status: "idle", details: "2nd Gen Member" },
            { id: 7, name: "Over", handle: "deleted_user831143ql5x", avatar: "https://i.pravatar.cc/150?u=over", banner: "https://images.unsplash.com/photo-1502134249126-9f3755a50d78?auto=format&fit=crop&w=400&q=80", status: "online", details: "2nd Gen Member" },
            { id: 8, name: "Pedro.", handle: "ainturpedro_", avatar: "https://i.pravatar.cc/150?u=pedro", banner: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80", status: "dnd", details: "2nd Gen Member" },
            { id: 9, name: "<Apollo> 名古ある者", handle: "t2p.snooby", avatar: "https://i.pravatar.cc/150?u=apollo", banner: "https://images.unsplash.com/photo-1557672172-298e090bd0f1?auto=format&fit=crop&w=400&q=80", status: "online", details: "2nd Gen Member" },
            { id: 10, name: "kenzhyy", handle: "_kiizi", avatar: "https://i.pravatar.cc/150?u=kenzhyy", banner: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&w=400&q=80", status: "idle", details: "2nd Gen Member" },
        ];

        // --- Components ---

        const StatusIndicator = ({ status }) => {
            const colors = {
                online: 'bg-green-500',
                idle: 'bg-yellow-500',
                dnd: 'bg-red-500',
                offline: 'bg-gray-500',
            };
            return (
                <span className={`absolute bottom-1 right-1 w-4 h-4 rounded-full border-2 border-[#0a0f1c] ${colors[status] || colors.offline}`} />
            );
        };

        const ProfileCard = ({ user }) => {
            return (
                <div className="relative w-full max-w-[320px] rounded-xl overflow-hidden border border-blue-900/50 bg-[#0a0f1c] shadow-lg shadow-blue-900/20 group cursor-pointer transition-all duration-300 hover:scale-[1.02] hover:shadow-blue-500/20">
                    {/* Banner */}
                    <div 
                        className="h-[120px] w-full bg-cover bg-center transition-transform duration-500 group-hover:scale-105" 
                        style={{ backgroundImage: `url(${user.banner})` }} 
                    />
                    
                    {/* Avatar & Info */}
                    <div className="px-4 pb-5 relative z-10">
                        <div className="relative -mt-10 mb-3 w-20 h-20">
                            <img 
                                src={user.avatar} 
                                alt={user.name} 
                                className="w-full h-full rounded-full border-4 border-[#0a0f1c] object-cover bg-gray-800" 
                            />
                            <StatusIndicator status={user.status} />
                        </div>
                        
                        <h3 className="text-white font-semibold text-lg tracking-wide">{user.name}</h3>
                        <p className="text-blue-400/80 font-mono text-xs mt-1">@{user.handle}</p>
                    </div>

                    {/* Hover Overlay (Family Details) */}
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0a0f1c] via-[#0a0f1c]/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4 pointer-events-none">
                        <p className="text-blue-200 text-sm font-medium border-t border-blue-800/50 pt-3">
                            {user.details}
                        </p>
                    </div>
                </div>
            );
        };

        function App() {
            const [searchTerm, setSearchTerm] = useState('');

            return (
                <div className="min-h-screen bg-blue-950 text-gray-200 font-sans selection:bg-blue-500/30 relative">
                    {/* Background Gradient & Noise */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(29,78,216,0.15),transparent_70%)]" />
                        <div className="absolute inset-0 opacity-[0.03] bg-noise" />
                    </div>

                    {/* Navigation */}
                    <nav className="relative z-10 flex justify-between items-center px-8 py-6 max-w-7xl mx-auto">
                        <div className="flex items-center gap-3">
                            {/* Placeholder for Skull Logo */}
                            <div className="w-10 h-10 rounded-full bg-blue-900/50 border border-blue-700 flex items-center justify-center">
                                <i data-lucide="globe" className="w-5 h-5 text-blue-400"></i>
                            </div>
                            <span className="font-bold text-xl tracking-[0.2em] text-white uppercase">Remorse</span>
                        </div>
                        
                        <div className="hidden md:flex gap-8 text-xs font-medium tracking-[0.15em] text-gray-400">
                            <a href="#" className="hover:text-blue-400 transition-colors">HOME</a>
                            <a href="#" className="hover:text-blue-400 transition-colors">MEMBERS</a>
                            <a href="#" className="hover:text-blue-400 transition-colors">AFFILIATES</a>
                            <a href="#" className="hover:text-blue-400 transition-colors">GALLERIES</a>
                            <a href="#" className="hover:text-blue-400 transition-colors">CITIES</a>
                        </div>
                    </nav>

                    {/* Header & Search */}
                    <div className="relative z-10 max-w-7xl mx-auto px-8 mt-12 flex flex-col md:flex-row justify-between items-center gap-6">
                        <p className="text-gray-400 font-mono text-sm tracking-wide text-center md:text-left">
                            Hover a card — click the <span className="text-blue-400 font-bold">remorse</span> name for family details
                        </p>
                        
                        <div className="relative w-full md:w-72">
                            <input 
                                type="text" 
                                placeholder="Search remorse..." 
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full bg-[#0a0f1c] border border-blue-900/60 rounded-lg py-2.5 pl-4 pr-10 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                            />
                            <i data-lucide="search" className="absolute right-3 top-3 w-4 h-4 text-gray-500"></i>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="relative z-10 max-w-7xl mx-auto px-8 pb-24">
                        
                        {/* Brothers Section */}
                        <section className="mt-20">
                            <h2 className="text-center text-blue-400 font-mono text-sm tracking-[0.3em] mb-10">BROTHERS</h2>
                            <div className="flex justify-center">
                                {brothersData.map((user) => (
                                    <ProfileCard key={user.id} user={user} />
                                ))}
                            </div>
                        </section>

                        {/* 2nd Generation Section */}
                        <section className="mt-24">
                            <h2 className="text-center text-blue-400 font-mono text-sm tracking-[0.3em] mb-10">2ND GENERATION</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 justify-items-center">
                                {secondGenData.map((user) => (
                                    <ProfileCard key={user.id} user={user} />
                                ))}
                            </div>
                        </section>

                    </main>

                    {/* Footer / Netlify Badge */}
                    <div className="fixed bottom-6 right-6 z-50">
                        <a href="#" className="flex items-center gap-2 bg-[#0a0f1c] border border-blue-900/50 px-4 py-2 rounded-lg text-xs text-gray-400 hover:text-white transition-colors shadow-lg">
                            <i data-lucide="zap" className="w-4 h-4 text-blue-400"></i>
                            Powered by Netlify
                        </a>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide icons after render
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
